name = "nai-prompt-manager-testenv"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = 'G:\AI\NAI\NAI Atelier\resources\runtime\dist'

# 独立测试实例：与生产实例共用同一份 dist 产物（保证测的就是线上那份代码），
# 但 DB / R2 / 端口 / 身份标识全部独立。
# 关键：D1 本地文件名 = f(database_name + database_id)。这里沿用同一个 id，
# 但 --persist-to 指向 nai-atelier-testenv/persist，所以落在完全不同的目录，
# 物理上不可能碰到生产 workshop 的 local-data。
[[d1_databases]]
binding = "DB"
database_name = "nai-db"
database_id = "04b0c4f6-8b3b-4e1d-a880-2dfe4f7d75f7"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "nai-assets"
